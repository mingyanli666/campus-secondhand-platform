# ============================================================
# nginx 配置：托管前端静态文件 + 反向代理后端接口
#
# 放在 conf.d/ 下，所以只写 server 块，不写完整的 nginx.conf。
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传图片最大 10MB，nginx 默认只有 1MB，
    # 不改的话前端传大图会拿到 413，而后端根本收不到请求
    client_max_body_size 10m;

    # ---------- 压缩 ----------
    # 前端产物里 element chunk 未压缩有 800+ KB，开了 gzip 传输量能降到 1/3
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/xml
                      image/svg+xml;

    # ---------- 静态资源缓存 ----------
    # Vite 产物带内容哈希（index-Bta6tndf.js），内容变了文件名就变，
    # 所以可以放心让浏览器缓存一年
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 但入口文件绝对不能缓存：它引用的正是上面那些带哈希的资源名。
    # 入口被缓存住，发版后用户会一直加载旧版本。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    off;
    }

    # ---------- 前端路由 ----------
    # Vue Router 用的是 history 模式，/product/list 这类路径在服务器上
    # 并不存在真实文件。不加 try_files 的话，用户刷新页面就会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;

        # 把真实客户端信息透传给后端，否则后端日志里全是 nginx 容器 IP，
        # 出问题根本定位不到是谁在刷接口
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- 上传的图片 ----------
    # 后端已经用 WebMvcConfig 把上传目录映射成 /uploads/**，
    # 这里直接转发过去，不用在 nginx 上再挂一份数据卷
    location /uploads/ {
        proxy_pass       http://backend:8080/uploads/;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # 隐藏 nginx 版本号，不给扫描器送信息
    server_tokens off;
}
