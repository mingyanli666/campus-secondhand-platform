server:
  port: 8080
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: used-digital-platform

  # 默认激活 local profile。
  # application-local.yml 已被 .gitignore 排除，里面放本机的数据库密码，
  # 这样真实密码不会进版本库。别人 clone 下来没有这个文件也没关系 ——
  # 会回落到下面的 ${DB_PASSWORD:123456} 默认值。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/used_digital_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    # 不要把真实密码写进这个文件：它会随代码提交到公开仓库
    password: ${DB_PASSWORD:123456}
    hikari:
      # 连接池配置：高并发场景下保证连接可用
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.digital.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，上线时注释掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义配置
platform:
  jwt:
    # HS256 要求密钥至少 32 字节
    secret: used-digital-platform-jwt-secret-key-2026-graduation-project
    # token 有效期（小时）
    expire-hours: 72
    header: Authorization
  file:
    # 图片上传根目录，相对项目运行目录
    upload-path: ./uploads/
    # 允许上传的图片后缀
    allow-ext: jpg,jpeg,png,gif,webp,bmp
    # 单张图片最大 10MB
    max-size: 10485760
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.digital.platform: debug
