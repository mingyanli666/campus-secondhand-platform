# ============================================================
# 持续集成：每次 push / PR 都跑一遍
#
# 三个任务并行/串行：
#   backend  —— 后端单元测试（15 个）
#   frontend —— ESLint + Prettier + 单元测试 + 覆盖率 + 生产构建（39 个）
#   smoke    —— 真的把整套服务用 docker compose 拉起来，等健康检查通过，
#               再打接口验证。这一步同时验证了 Dockerfile、compose 编排、
#               healthcheck、nginx 反代和前后端联通性。
#
# 为什么要 smoke 这一步？
# 「单测全绿」不等于「部署起来能跑」—— 我就踩过「lint 和 format 都通过、
# 构建却失败」的坑。只有真的启动一次才算数。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个分支连续 push 时，取消上一次还没跑完的，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 运行单元测试
        working-directory: backend
        run: mvn -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端 lint + 测试 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier 格式检查
        working-directory: frontend
        run: npm run format:check

      - name: 单元测试 + 覆盖率
        working-directory: frontend
        run: npm run test:cov

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  smoke:
    name: 容器编排冒烟测试
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 准备环境变量
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-only-password
          JWT_SECRET=ci-only-secret-key-at-least-32-bytes-long-0000
          WEB_PORT=80
          EOF

      - name: 启动整套服务并等待健康检查
        # --wait 会一直等到所有带 healthcheck 的服务变成 healthy，
        # 任何一个不健康就直接失败 —— 不用自己写 sleep + 轮询
        run: docker compose up -d --build --wait

      - name: 验证接口真的能访问
        run: |
          echo '--- 后端接口（经 nginx 反代）---'
          curl -fsS http://localhost/api/category/list | head -c 300
          echo ''
          echo '--- 前端页面 ---'
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://localhost/
          echo '--- 后端健康检查 ---'
          curl -fsS http://localhost/api/../actuator/health || true

      - name: 失败时打印容器日志
        if: failure()
        run: docker compose logs --tail=150

      - name: 清理
        if: always()
        run: docker compose down -v
